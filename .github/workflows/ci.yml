name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.13
      # Pas d'Odoo en intégration continue : les 3 tests contre le vrai Odoo sont ignorés,
      # Odoo est lu depuis l'instantané commité.
      - run: uv run pytest -q
        env:
          ODOO_URL: http://localhost:9
