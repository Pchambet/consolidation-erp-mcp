name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No Odoo in CI: the 3 tests against a live Odoo are skipped and Odoo is read from the
      # committed snapshot.
      - run: uv run pytest -q
        env:
          ODOO_URL: http://localhost:9
