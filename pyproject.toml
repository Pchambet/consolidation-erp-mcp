[project]
name = "consolidation-erp-mcp"
version = "0.1.0"
description = "Consolidate three ERPs into a DuckDB star schema, run three-way-match controls in SQL, and query the result from an LLM agent over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
consolidation = "consolidation_erp.cli:main"
consolidation-mcp = "consolidation_erp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consolidation_erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["odoo: needs the live Odoo 17 instance (./scripts/odoo_up.sh)"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
# `l` is the conventional short name for a row (`ligne`) throughout the code base.
ignore = ["E741"]

[tool.ruff.lint.isort]
known-local-folder = ["fake_odoo"]
