[project]
name = "consolidation-erp-mcp"
version = "0.1.0"
description = "Maquette : consolider trois ERP, contrôler les écarts et interroger le tout depuis Claude par MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
consolidation = "consolidation_erp.cli:main"
consolidation-mcp = "consolidation_erp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consolidation_erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["odoo: nécessite l'instance Odoo de la maquette (docker compose up)"]
