# ERP A de la maquette : un vrai Odoo 17 jetable, avec le seul module « achats ».
# admin / admin : les identifiants d'une instance de démonstration, jamais ceux d'un vrai système.
name: consolidation-erp-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      timeout: 3s
      retries: 20
  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8170:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
volumes:
  db-data:
  odoo-data:
